<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PLN Full Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        /* Paksa Body & HTML tidak ada sisa ruang */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        
        /* Container Utama */
        #reader { 
            position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; 
            border: none !important; margin: 0 !important; padding: 0 !important;
        }

        /* INI KUNCINYA: Memaksa video kamera melebar buang warna hitam */
        #reader video { 
            width: 100% !important; height: 100% !important; 
            object-fit: cover !important; /* Menghilangkan bar hitam */
        }

        /* Matikan semua garis, kotak, dan teks bawaan library */
        #reader__scan_region, #reader__scan_region img { display: none !important; border: none !important; }
        #reader__dashboard { display: none !important; }
        #reader__status_span { display: none !important; }
        #reader__header_message { display: none !important; }

        /* Tombol Batal Melayang */
        .btn-batal {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 15px 40px; background: rgba(255, 68, 68, 0.8); color: white;
            border: none; border-radius: 50px; font-weight: bold; z-index: 999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-size: 16px;
        }
    </style>
</head>
<body>

    <div id="reader"></div>
    <button class="btn-batal" onclick="window.close()">KEMBALI</button>

<script>
    // Inisialisasi tanpa elemen UI otomatis
    const html5QrCode = new Html5Qrcode("reader", { verbose: false });

    const config = { 
        fps: 25, 
        // JANGAN isi qrbox, supaya dia scan seluruh sensor kamera
        aspectRatio: window.innerHeight / window.innerWidth,
        disableFlip: false
    };

    const onScanSuccess = (decodedText) => {
        if (navigator.vibrate) navigator.vibrate(100);
        window.opener.postMessage({ type: "HASIL_QR", data: decodedText }, "*");
        
        html5QrCode.stop().then(() => {
            window.close();
        }).catch(() => {
            window.close();
        });
    };

    // Jalankan Kamera
    html5QrCode.start(
        { facingMode: "environment" }, 
        config, 
        onScanSuccess
    ).catch((err) => {
        console.error("Kamera Gagal:", err);
    });
</script>
</body>
</html>
