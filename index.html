<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner PLN Peka</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { margin: 0; background: #121212; color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        #reader { width: 100%; flex-grow: 1; }
        .footer { padding: 15px; text-align: center; background: #1e1e1e; border-top: 2px solid #00e5ff; }
        button { padding: 12px 25px; background: #ff4444; color: white; border: none; border-radius: 8px; font-weight: bold; width: 100%; }
        h3 { margin: 0 0 10px 0; color: #00e5ff; font-size: 16px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="reader"></div>

    <div class="footer">
        <h3>Arahkan ke QR Code</h3>
        <button onclick="window.close()">BATAL / KEMBALI</button>
    </div>

<script>
    // Konfigurasi agar kamera lebih peka
    const config = { 
        fps: 20,           // Lebih tinggi biar lebih cepat nangkep
        qrbox: { width: 250, height: 250 }, // Area kotak scan
        aspectRatio: 1.0   // Kotak presisi
    };

    const html5QrCode = new Html5Qrcode("reader");

    const qrCodeSuccessCallback = (decodedText, decodedResult) => {
        // Jika berhasil scan:
        // 1. Beri feedback getar (jika HP dukung)
        if (navigator.vibrate) navigator.vibrate(100);

        // 2. Kirim data ke Google Apps Script Boss
        window.opener.postMessage({
            type: "HASIL_QR",
            data: decodedText
        }, "*");

        // 3. Tutup scanner
        html5QrCode.stop().then(() => {
            window.close();
        });
    };

    // Mulai kamera belakang (environment)
    html5QrCode.start(
        { facingMode: "environment" }, 
        config, 
        qrCodeSuccessCallback
    ).catch((err) => {
        console.error("Gagal kamera: ", err);
        alert("Kamera tidak diizinkan atau tidak ditemukan.");
    });
</script>
</body>
</html>
