<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PLN Fast Scan</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; height: 100vh; overflow: hidden; }
        #reader { width: 100% !important; height: 100% !important; }
        /* Garis bantu kotak saja, tanpa animasi */
        .box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 250px; height: 250px; border: 2px dashed #00e5ff;
            pointer-events: none; z-index: 10;
        }
        .btn-batal {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            padding: 12px 30px; background: rgba(255,0,0,0.7); color: white;
            border: none; border-radius: 5px; z-index: 20; font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="reader"></div>
    <div class="box"></div>
    <button class="btn-batal" onclick="window.close()">BATAL</button>

<script>
    const html5QrCode = new Html5Qrcode("reader");
    
    // Settingan paling enteng untuk HP
    const config = { 
        fps: 10, // Turunin lagi biar prosesor gak panas
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1.0,
        disableFlip: true 
    };

    html5QrCode.start(
        { facingMode: "environment" }, 
        config, 
        (decodedText) => {
            if (navigator.vibrate) navigator.vibrate(50);
            window.opener.postMessage({ type: "HASIL_QR", data: decodedText }, "*");
            html5QrCode.stop().then(() => { window.close(); });
        }
    ).catch(err => { console.error(err); });
</script>
</body>
</html>
